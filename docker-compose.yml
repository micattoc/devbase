services:
  n8n:
    image: n8nio/n8n:latest
    container_name: devbase_n8n
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./workflow:/workflows:ro
      - ./scripts:/scripts:ro
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false